<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance de 8 columnas</title>
<style>
  :root { --navy:#0A1F44; --cafe:#3B2C2A; --gris:#444343; --light:#E8ECF3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--gris); background:#fff; }
  .wrap { max-width:560px; margin:32px auto; padding:0 20px; }
  .card { border:1px solid var(--light); border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(10,31,68,.08); }
  .head { background:var(--navy); color:#fff; padding:18px 22px; }
  .head h1 { margin:0; font-size:20px; }
  .head p { margin:4px 0 0; font-size:13px; opacity:.85; }
  .body { padding:22px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .field { flex:1; min-width:180px; }
  label { display:block; font-size:12px; font-weight:bold; color:var(--cafe); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em; }
  input[type=date] { width:100%; padding:9px 10px; font-size:15px; border:1px solid #c9d1df; border-radius:6px; font-family:inherit; }
  button { margin-top:20px; width:100%; padding:12px; font-size:15px; font-weight:bold; color:#fff; background:var(--navy); border:0; border-radius:6px; cursor:pointer; }
  button:disabled { background:#9aa5b8; cursor:not-allowed; }
  .msg { margin-top:16px; font-size:14px; min-height:20px; }
  .msg.err { color:#B00020; }
  .msg.ok { color:#1B6E3A; }
  .nota { margin-top:14px; font-size:12px; color:#777; }
  .foot { text-align:center; font-size:11px; color:#888; margin-top:18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <h1>Balance de 8 columnas</h1>
      <p id="empresa">Conectando con Zoho Books…</p>
    </div>
    <div class="body">
      <div class="row">
        <div class="field"><label for="desde">Desde</label><input type="date" id="desde"></div>
        <div class="field"><label for="hasta">Hasta</label><input type="date" id="hasta"></div>
      </div>
      <button id="btn" disabled>Descargar Excel</button>
      <div class="msg" id="msg"></div>
      <div class="nota">El balance incluye el saldo de inicio. Ambas fechas deben ser del mismo año.</div>
    </div>
  </div>
  <div class="foot">Ruiz y Starke Tecnología · Pucará 50 Of. 409, Machalí · www.ruizystarke.cl</div>
</div>

<script>
// ====== CONFIGURACIÓN: pega aquí la URL /exec de tu aplicación web de Apps Script ======
const API_URL = 'https://script.google.com/macros/s/AKfycby7uhmZi0rxpd967djzOZjMvYQBPjD1i7O54sUiyUAPXFaSJy6JVP2ERGKOxF-rRdan/exec';
// =======================================================================================

const ORIGENES_ZOHO = /^https:\/\/([a-z0-9-]+\.)*zoho\.(com|eu|in|com\.au|jp|ca|sa)$/i;
let token = null;

const $ = id => document.getElementById(id);
const msg = (t, cls) => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); };

// Fechas por defecto: 1 de enero del año en curso hasta hoy
(function () {
  const hoy = new Date();
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  $('desde').value = hoy.getFullYear() + '-01-01';
  $('hasta').value = iso(hoy);
})();

// Busca un JWT dentro del mensaje que envía Zoho Books (sea texto u objeto)
function buscarJwt(x, prof) {
  if (prof > 5 || x == null) return null;
  if (typeof x === 'string') {
    if (/^[\w-]+\.[\w-]+\.[\w-]+$/.test(x)) return x;
    try { return buscarJwt(JSON.parse(x), prof + 1); } catch (e) { return null; }
  }
  if (typeof x === 'object') {
    for (const k in x) { const r = buscarJwt(x[k], prof + 1); if (r) return r; }
  }
  return null;
}

function leerClaims(jwt) {
  try {
    const b = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(b))));
  } catch (e) { return {}; }
}

window.addEventListener('message', ev => {
  if (!ORIGENES_ZOHO.test(ev.origin)) return;          // solo mensajes de Zoho
  const d = ev.data;
  if (d && d.type === 'ZOHO_WEBTAB_AUTH_TOKENS' && !d.jwt_token) {   // sesión terminada
    token = null; $('btn').disabled = true;
    return msg('La sesión de Zoho Books terminó. Recarga la pestaña.', 'err');
  }
  const jwt = (d && d.jwt_token) || buscarJwt(d, 0);
  if (!jwt) return;
  token = jwt;
  const c = leerClaims(jwt);
  const nombre = c.organization_name || c.org_name || '';
  $('empresa').textContent = nombre ? nombre : 'Conectado con Zoho Books';
  $('btn').disabled = false;
  msg('');
});

setTimeout(() => {
  if (!token) msg('No se recibió la conexión de Zoho Books. Abre este reporte desde la pestaña "8 columnas" dentro de Zoho Books.', 'err');
}, 8000);

$('btn').addEventListener('click', async () => {
  const desde = $('desde').value, hasta = $('hasta').value;
  if (!desde || !hasta) return msg('Elige ambas fechas.', 'err');
  if (desde > hasta) return msg('La fecha "Desde" no puede ser posterior a "Hasta".', 'err');
  if (desde.slice(0, 4) !== hasta.slice(0, 4)) return msg('Ambas fechas deben ser del mismo año.', 'err');

  $('btn').disabled = true;
  msg('Generando el balance… puede tardar hasta un minuto.');
  try {
    // Se envía como texto plano para evitar la verificación previa (CORS) de Google
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ token, desde, hasta }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error desconocido');

    const bytes = Uint8Array.from(atob(d.base64), ch => ch.charCodeAt(0));
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = d.nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    msg('✔ Listo: ' + d.nombre, 'ok');
  } catch (e) {
    msg('No se pudo generar: ' + e.message, 'err');
  } finally {
    $('btn').disabled = !token;
  }
});
</script>
</body>
</html>
